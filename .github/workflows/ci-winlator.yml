name: Android CI Bionic

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      AEO_USE_LLVM22_NATIVE: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone libadrenotools
        run: |
          rm -rf app/src/main/cpp/adrenotools

          git clone https://github.com/Pipetto-crypto/libadrenotools.git \
            app/src/main/cpp/adrenotools

          cd app/src/main/cpp/adrenotools
          git checkout 8483dfdaa2abf97ee89ad0e5f337e7b508550c6b

      - name: Clone linkernsbypass
        run: |
          mkdir -p app/src/main/cpp/adrenotools/lib

          git clone https://github.com/Pipetto-crypto/liblinkernsbypass.git \
            app/src/main/cpp/adrenotools/lib/linkernsbypass

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            glslang-tools \
            ninja-build \
            cmake \
            build-essential

      - name: Download required ImageFS assets
        run: |
          mkdir -p app/src/main/assets

          curl -L \
            https://downloads.gamenative.app/imagefs_gamenative.txz \
            -o app/src/main/assets/imagefs_gamenative.txz

          curl -L \
            https://downloads.gamenative.app/imagefs_patches_gamenative.tzst \
            -o app/src/main/assets/imagefs_patches_gamenative.tzst

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Build APK
        run: |
          ./gradlew assembleDebug \
            -Pae.useLlvm22Native=false \
            --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aesolator-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Aesolator Build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
