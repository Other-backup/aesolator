tasks.register("downloadImageFS") {
    def donorRootfsArtifacts = [
            [name: "imagefs_gamenative.txz", url: "https://downloads.gamenative.app/imagefs_gamenative.txz"],
            [name: "imagefs_patches_gamenative.tzst", url: "https://downloads.gamenative.app/imagefs_patches_gamenative.tzst"]
    ]
    def downloadDir = new File(buildDir, "downloads/imagefs")
    outputs.dir(downloadDir)
    doLast {
        donorRootfsArtifacts.each { artifact ->
            File destination = new File(downloadDir, artifact.name)
            if (destination.exists() && destination.isFile()) {
                println("Cached rootfs artifact already present: ${artifact.name}")
            } else {
                println("Downloading rootfs artifact into build cache: ${artifact.name}")
                destination.parentFile.mkdirs()
                new URL(artifact.url).withInputStream { input ->
                    destination.withOutputStream { output -> output << input }
                }
            }
        }
    }
}

tasks.register("verifyBundledImageFsAssets") {
    inputs.files(aeRequiredRootfsAssets.collect { name -> new File(aeAssetDir, name) })
    doLast {
        def missing = aeRequiredRootfsAssets.findAll { name ->
            File asset = new File(aeAssetDir, name)
            !asset.exists() || !asset.isFile()
        }
        if (!missing.isEmpty()) {
            throw new GradleException("Missing bundled imagefs assets: ${missing.join(', ')}")
        }
    }
}

tasks.register("verifyNoRetiredImageFsAssets") {
    inputs.files(aeRetiredRootfsAssets.collect { name -> new File(aeAssetDir, name) })
    doLast {
        def present = aeRetiredRootfsAssets.findAll { name ->
            File asset = new File(aeAssetDir, name)
            asset.exists() && asset.isFile()
        }
        if (!present.isEmpty()) {
            throw new GradleException("Retired imagefs assets must not be packaged: ${present.join(', ')}")
        }
    }
}

tasks.register("prepareEmbeddedWineAssets") {
    inputs.files(aeRequiredRuntimeAssets.collect { name -> new File(aeAssetDir, name) })
    doLast {
        if (!aeEnforceEmbeddedRuntimeAssets) {
            println("Embedded runtime asset check skipped (Contents-first lane active).")
            return
        }
        def missing = aeRequiredRuntimeAssets.findAll { name ->
            File asset = new File(aeAssetDir, name)
            !asset.exists() || !asset.isFile()
        }
        if (!missing.isEmpty()) {
            throw new GradleException("Missing embedded runtime assets: ${missing.join(', ')}")
        }
    }
}

tasks.register("prepareBundledProton11Asset") {
    File outputFile = new File(aeGeneratedAssetsDir, aeBundledProton11AssetPath)
    inputs.property("aeBundledProton11LocalPath", aeBundledProton11LocalPath)
    inputs.property("aeBundledProton11Url", aeBundledProton11Url)
    inputs.property("aeBundledProton11ReleasesApi", aeBundledProton11ReleasesApi)
    outputs.file(outputFile)
    doLast {
        outputFile.parentFile.mkdirs()
        File localPayload = new File(aeBundledProton11LocalPath)
        if (localPayload.isFile()) {
            Files.copy(localPayload.toPath(), outputFile.toPath(), StandardCopyOption.REPLACE_EXISTING)
            println("Bundled Proton 11 asset copied from local WCP: ${localPayload}")
            return
        }

        String resolvedUrl = aeBundledProton11Url.trim()
        if (resolvedUrl.isEmpty()) {
            def apiConnection = new URL(aeBundledProton11ReleasesApi).openConnection()
            apiConnection.setRequestProperty("User-Agent", "Ae.solator Gradle Proton11 asset resolver")
            apiConnection.setRequestProperty("Accept", "application/vnd.github+json, application/json;q=0.9, */*;q=0.8")
            def releases = new JsonSlurper().parse(apiConnection.inputStream)
            releases.find { release ->
                def asset = release.assets.find { asset ->
                    String name = asset.name.toString().toLowerCase(Locale.US)
                    name.contains("proton")
                            && name.contains("11")
                            && name.contains("arm64ec")
                            && (name.endsWith(".wcp.xz") || name.endsWith(".wcp.zst") || name.endsWith(".wcp"))
                }
                if (asset != null) {
                    resolvedUrl = asset.browser_download_url.toString()
                    return true
                }
                return false
            }
        }
        if (resolvedUrl.isEmpty()) {
            throw new GradleException("Unable to resolve a Proton 11 ARM64EC WCP asset from ${aeBundledProton11ReleasesApi}")
        }

        File partFile = new File(outputFile.absolutePath + ".part")
        if (partFile.exists()) partFile.delete()
        def payloadConnection = new URL(resolvedUrl).openConnection()
        payloadConnection.setRequestProperty("User-Agent", "Ae.solator Gradle Proton11 asset resolver")
        payloadConnection.setRequestProperty("Accept", "application/octet-stream, */*")
        payloadConnection.inputStream.withCloseable { input ->
            partFile.withOutputStream { output -> output << input }
        }
        Files.move(partFile.toPath(), outputFile.toPath(), StandardCopyOption.REPLACE_EXISTING)
        println("Bundled Proton 11 asset downloaded from Nightlies: ${resolvedUrl}")
    }
}

