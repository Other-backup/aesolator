pluginManagement {
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id.startsWith("com.android.") && requested.version != null) {
                useModule("com.android.tools.build:gradle:${requested.version}")
            }
        }
    }
    repositories {
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "Winlator"
include ':app'
def aeEnableUbuntuFsFeature = (
        (gradle.startParameter.projectProperties["ae.enableUbuntuFsFeature"] ?: "") == "true" ||
                (System.getenv("AEO_ENABLE_UBUNTUFS_FEATURE") ?: "") == "1"
)
if (aeEnableUbuntuFsFeature) {
    include ':ubuntufs'
}
