import java.net.URL
import java.nio.file.Files
import java.nio.file.StandardCopyOption
import java.util.Properties
import groovy.json.JsonSlurper

class AeBuildHostSupport {
    static String trimValue(Object value) {
        value == null ? "" : value.toString().trim()
    }

    static List<String> nonBlank(List values) {
        values.collect { trimValue(it) }.findAll { !it.isEmpty() }
    }

    static Properties readLocalProperties(File propsFile) {
        def props = new Properties()
        if (propsFile.exists()) {
            propsFile.withInputStream { props.load(it) }
        }
        props
    }

    static void registerOptionalFileInput(def taskInputs, String name, File file) {
        taskInputs.property("${name}Path", file.absolutePath)
        taskInputs.property("${name}Exists", file.exists())
        if (file.exists()) {
            taskInputs.file(file)
        }
    }

    static boolean hasRequiredFiles(File dir, List<String> names) {
        dir != null && dir.isDirectory() && names.every { new File(dir, it).isFile() }
    }

    static String resolveNdkDir(File propsFile, String ndkVersion, Map<String, String> env) {
        def props = readLocalProperties(propsFile)
        def sdkDir = trimValue(props.getProperty("sdk.dir") ?: env["ANDROID_SDK_ROOT"])
        def candidates = nonBlank([
                props.getProperty("ndk.dir"),
                env["ANDROID_NDK_ROOT"],
                env["ANDROID_NDK_HOME"],
                sdkDir ? "${sdkDir}/ndk/${ndkVersion}" : ""
        ])
        candidates.find { new File(it).isDirectory() } ?: (candidates ? candidates[0] : "")
    }

    static File resolveNdkPrebuiltRoot(File propsFile, String ndkVersion, Map<String, String> env) {
        def ndkDir = resolveNdkDir(propsFile, ndkVersion, env)
        if (!ndkDir) {
            return null
        }
        File prebuiltRoot = new File(ndkDir, "toolchains/llvm/prebuilt")
        if (!prebuiltRoot.isDirectory()) {
            return null
        }
        def explicitHostTag = trimValue(env["AEO_ANDROID_NDK_HOST_TAG"])
        if (!explicitHostTag.isEmpty()) {
            File explicitDir = new File(prebuiltRoot, explicitHostTag)
            if (explicitDir.isDirectory()) {
                return explicitDir
            }
        }
        def hostDirs = prebuiltRoot.listFiles()?.findAll { candidate ->
            candidate.isDirectory() && candidate.name != "bin"
        }?.toList()?.sort { left, right -> left.name <=> right.name }
        hostDirs ? hostDirs[0] : null
    }

    static File resolveLibcxxSharedArm64(File propsFile, String ndkVersion, Map<String, String> env) {
        File prebuiltRoot = resolveNdkPrebuiltRoot(propsFile, ndkVersion, env)
        prebuiltRoot == null
                ? null
                : new File(prebuiltRoot, "sysroot/usr/lib/aarch64-linux-android/libc++_shared.so")
    }

    static File resolveVirglWrapperJniSourceDir(File pointerFile, File bundledDir) {
        def requiredNames = ["libvirglrenderer.so", "libepoxy.so"]
        if (pointerFile.exists() && pointerFile.isFile()) {
            String runRootPath = pointerFile.getText("UTF-8").trim()
            if (runRootPath.isEmpty()) {
                throw new GradleException("VirGL wrapper pointer is empty: ${pointerFile}")
            }

            File runRoot = new File(runRootPath)
            File jniSourceDir = new File(runRoot, "jni/arm64-v8a")
            if (!hasRequiredFiles(jniSourceDir, requiredNames)) {
                throw new GradleException("VirGL wrapper JNI directory is missing required payload: ${jniSourceDir}")
            }
            return jniSourceDir
        }

        hasRequiredFiles(bundledDir, requiredNames) ? bundledDir : null
    }

    static String runCommand(List<String> command, File workingDir = null, boolean captureOutput = false, File logFile = null) {
        List<String> normalizedCommand = command.collect { it.toString() }
        ProcessBuilder builder = new ProcessBuilder(normalizedCommand)
        if (workingDir != null) {
            builder.directory(workingDir)
        }
        builder.redirectErrorStream(true)
        if (logFile != null) {
            logFile.parentFile.mkdirs()
            builder.redirectOutput(ProcessBuilder.Redirect.appendTo(logFile))
        }
        Process process = builder.start()
        StringBuilder output = new StringBuilder()
        if (logFile == null) {
            process.inputStream.withReader("UTF-8") { reader ->
                reader.eachLine { line ->
                    if (captureOutput) {
                        output.append(line).append('\n')
                    } else {
                        System.out.println(line)
                    }
                }
            }
        }
        int exitCode = process.waitFor()
        if (exitCode != 0) {
            String tail = logFile != null && logFile.isFile() ? "\nLog tail:\n${tail(logFile, 80)}" : ""
            throw new GradleException("Command failed with exit code ${exitCode}: ${normalizedCommand.join(' ')}${tail}")
        }
        output.toString()
    }

    static String tail(File file, int maxLines) {
        List<String> lines = file.readLines("UTF-8")
        lines.drop(Math.max(0, lines.size() - maxLines)).join('\n')
    }
}

