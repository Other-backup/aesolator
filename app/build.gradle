tasks.register("downloadImageFS") {
    def assetDir = new File(project.rootDir, ["app","src","main","assets"].join(File.separator))
    def legacyRootfsArtifacts = [
            "imagefs.txz",
            "imagefs.txz.02"
    ]
    def donorRootfsArtifacts = [
            [name: "imagefs_bionic.txz", url: "https://downloads.gamenative.app/imagefs_bionic.txz"],
            [name: "imagefs_gamenative.txz", url: "https://downloads.gamenative.app/imagefs_gamenative.txz"],
            [name: "imagefs_patches_gamenative.tzst", url: "https://downloads.gamenative.app/imagefs_patches_gamenative.tzst"]
    ]

    doLast {
        legacyRootfsArtifacts.each { legacyName ->
            File legacyAsset = new File(assetDir, legacyName)
            if (legacyAsset.exists()) {
                println("Removing legacy rootfs artifact from mainline bundle: ${legacyName}")
                legacyAsset.delete()
            }
        }
        donorRootfsArtifacts.each { artifact ->
            File destination = new File(assetDir, artifact.name)
            if (destination.exists()) {
                println("RootFS artifact already present: ${artifact.name}")
            } else {
                println("Downloading donor rootfs artifact ${artifact.name} ...")
                destination.parentFile.mkdirs()
                new URL(artifact.url).withInputStream { input ->
                    destination.withOutputStream { output -> output << input }
                }
            }
        }
    }
}

tasks.register("prepareEmbeddedWineAssets") {
    def assetDir = new File(project.rootDir, ["app","src","main","assets"].join(File.separator))
    def enforceEmbeddedRuntimeAssets = (
            (project.findProperty("ae.enforceEmbeddedRuntimeAssets")?.toString() ?: "") == "true" ||
                    (System.getenv("AEO_ENFORCE_EMBEDDED_RUNTIME_ASSETS") ?: "") == "1"
    )
    def requiredRuntimeAssets = [
            "freewine11-arm64ec.wcp"
    ]

    doLast {
        if (!enforceEmbeddedRuntimeAssets) {
            println("Embedded runtime asset check skipped (Contents-first lane active).")
            return
        }
        def missing = []
        requiredRuntimeAssets.each { name ->
            File f = new File(assetDir, name)
            if (!f.exists() || !f.isFile()) {
                missing.add(name)
            }
        }
        if (!missing.isEmpty()) {
            throw new GradleException("Missing embedded runtime assets: ${missing.join(', ')}")
        }
    }
}

tasks.register("prepareKotlinBuildScriptModel"){}
prepareEmbeddedWineAssets.dependsOn(downloadImageFS)
preBuild.dependsOn(prepareEmbeddedWineAssets)

def aeLocalProperties = new Properties()
File aeLocalPropertiesFile = rootProject.file("local.properties")
if (aeLocalPropertiesFile.exists()) {
    aeLocalPropertiesFile.withInputStream { aeLocalProperties.load(it) }
}
def aeNdkDir = (aeLocalProperties.getProperty("ndk.dir") ?: System.getenv("ANDROID_NDK_ROOT") ?: "").trim()
def aeGeneratedJniLibsDir = new File(buildDir, "generated/ae-jniLibs")
def aeLibcxxSharedArm64 = aeNdkDir.isEmpty()
        ? null
        : new File(aeNdkDir, "toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so")

tasks.register("prepareRuntimeSharedJni", Copy) {
    if (aeLibcxxSharedArm64 == null || !aeLibcxxSharedArm64.isFile()) {
        throw new GradleException("Required NDK runtime library is missing: ${aeLibcxxSharedArm64}")
    }
    from(aeLibcxxSharedArm64)
    into(new File(aeGeneratedJniLibsDir, "arm64-v8a"))
}

preBuild.dependsOn(prepareRuntimeSharedJni)

def aeroVersionCodeRaw = project.findProperty("ae.versionCode") ?: System.getenv("AEROSO_APP_VERSION_CODE") ?: "20"
int aeroVersionCode
try {
    aeroVersionCode = Integer.parseInt(aeroVersionCodeRaw.toString())
} catch (Exception ignored) {
    aeroVersionCode = 20
}
def aeroVersionName = (project.findProperty("ae.versionName") ?: System.getenv("AEROSO_APP_VERSION_NAME") ?: "0.9c+").toString()
def aeSigningStoreFileRaw = project.findProperty("ae.signing.storeFile")
        ?: System.getenv("AEO_ANDROID_KEYSTORE")
        ?: "${project.projectDir}/testkey_untrusted.jks"
def aeSigningStorePassword = (project.findProperty("ae.signing.storePassword")
        ?: System.getenv("AEO_ANDROID_KEYSTORE_PASSWORD")
        ?: "android").toString()
def aeSigningKeyAlias = (project.findProperty("ae.signing.keyAlias")
        ?: System.getenv("AEO_ANDROID_KEY_ALIAS")
        ?: "androiddebugkey").toString()
def aeSigningKeyPassword = (project.findProperty("ae.signing.keyPassword")
        ?: System.getenv("AEO_ANDROID_KEY_PASSWORD")
        ?: aeSigningStorePassword).toString()
File aeSigningStoreFile = file(aeSigningStoreFileRaw.toString())

if (!aeSigningStoreFile.exists()) {
    throw new GradleException("Stable signing keystore is missing: ${aeSigningStoreFile}")
}

android {
    namespace 'com.winlator.cmod'
    // Keep compileSdk from your current config. If you want to match Termux-X11, you could set to 34.
    compileSdk 34
    buildToolsVersion "35.0.0"
    dynamicFeatures = [":ubuntufs"]

    sourceSets {
        main {
            assets.srcDirs += [new File(rootProject.projectDir, "contents").absolutePath]
            jniLibs.srcDirs += [aeGeneratedJniLibsDir.absolutePath]
        }
    }

    defaultConfig {
        applicationId "com.winlator.cmod"
        minSdkVersion 26
        // We’re preserving Winlator’s request to keep targetSdkVersion at 28
        targetSdkVersion 28

        versionCode aeroVersionCode
        versionName aeroVersionName

        // External native build from Winlator
        externalNativeBuild {
            cmake {
                cppFlags ''
            }
        }

        // You originally only did arm64-v8a. If you want multi-ABI splits, see below.
        ndk {
            abiFilters 'arm64-v8a'
        }
    }


    // Java versions: Winlator uses Java 17, Termux-X11 used 1.9
    // Using 17 is typically fine (covers 1.9 features).
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    signingConfigs {
        stableDebug {
            storeFile aeSigningStoreFile
            storePassword aeSigningStorePassword
            keyAlias aeSigningKeyAlias
            keyPassword aeSigningKeyPassword
        }
    }

    // Keep Winlator’s buildTypes
    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.stableDebug
        }
        // If you have a release build type, add it here
    }

    ndkVersion '29.0.14206865'

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
        }
    }

    // If you want to be sure modern JNI packaging is used:
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    // Winlator’s dependencies
    implementation 'androidx.appcompat:appcompat:1.4.0'
