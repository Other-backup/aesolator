tasks.register("prepareRuntimeSharedJni") {
    File outputDir = new File(aeGeneratedJniLibsDir, "arm64-v8a")
    AeBuildHostSupport.registerOptionalFileInput(inputs, "aeLocalPropertiesFile", aeLocalPropertiesFile)
    inputs.property("aeResolvedNdkVersion", aeResolvedNdkVersion)
    if (aeBuildEnv["AEO_ANDROID_NDK_HOST_TAG"] != null) {
        inputs.property("AEO_ANDROID_NDK_HOST_TAG", aeBuildEnv["AEO_ANDROID_NDK_HOST_TAG"])
    }
    outputs.file(new File(outputDir, "libc++_shared.so"))
    doLast {
        File libcxxSharedArm64 = AeBuildHostSupport.resolveLibcxxSharedArm64(
                aeLocalPropertiesFile,
                aeResolvedNdkVersion,
                aeBuildEnv
        )
        if (libcxxSharedArm64 == null || !libcxxSharedArm64.isFile()) {
            File prebuiltRoot = AeBuildHostSupport.resolveNdkPrebuiltRoot(
                    aeLocalPropertiesFile,
                    aeResolvedNdkVersion,
                    aeBuildEnv
            )
            throw new GradleException(
                    "Required NDK runtime library is missing: ${libcxxSharedArm64} " +
                            "(resolved prebuilt root: ${prebuiltRoot})"
            )
        }
        outputDir.mkdirs()
        Files.copy(
                libcxxSharedArm64.toPath(),
                new File(outputDir, libcxxSharedArm64.name).toPath(),
                StandardCopyOption.REPLACE_EXISTING
        )
    }
}

tasks.register("prepareVirglWrapperJni") {
    File outputDir = new File(aeGeneratedJniLibsDir, "arm64-v8a")
    AeBuildHostSupport.registerOptionalFileInput(inputs, "aeVirglWrapperPointerFile", aeVirglWrapperPointerFile)
    AeBuildHostSupport.registerOptionalFileInput(inputs, "aeBundledVirglRendererFile", new File(aeBundledArm64JniLibsDir, "libvirglrenderer.so"))
    AeBuildHostSupport.registerOptionalFileInput(inputs, "aeBundledEpoxyFile", new File(aeBundledArm64JniLibsDir, "libepoxy.so"))
    outputs.files(
            new File(outputDir, "libvirglrenderer.so"),
            new File(outputDir, "libepoxy.so")
    )
    doLast {
        File jniSourceDir = AeBuildHostSupport.resolveVirglWrapperJniSourceDir(
                aeVirglWrapperPointerFile,
                aeBundledArm64JniLibsDir
        )
        if (jniSourceDir == null) {
            if (aeRequireVirglWrapperJni) {
                throw new GradleException("Fresh VirGL wrapper JNI payload is required but missing from source build outputs.")
            }
            println("VirGL wrapper JNI payload is absent in clean source lane; skipping APK-native VirGL payload staging.")
            return
        }

        outputDir.mkdirs()
        ["libvirglrenderer.so", "libepoxy.so"].each { fileName ->
            File source = new File(jniSourceDir, fileName)
            if (!source.isFile()) {
                throw new GradleException("Required VirGL JNI payload is missing: ${source}")
            }
            Files.copy(
                    source.toPath(),
                    new File(outputDir, fileName).toPath(),
                    StandardCopyOption.REPLACE_EXISTING
            )
        }
    }
}

tasks.register("prepareVulkanWrapperJni") {
    File outputDir = new File(aeGeneratedJniLibsDir, "arm64-v8a")
    File outputFile = new File(outputDir, "libvulkan_wrapper.so")
    AeBuildHostSupport.registerOptionalFileInput(inputs, "aeTarExtractTool", aeTarExtractTool)
    AeBuildHostSupport.registerOptionalFileInput(inputs, "aeVulkanWrapperArchive", aeVulkanWrapperArchive)
    outputs.file(outputFile)
    doLast {
        if (!aeTarExtractTool.isFile()) {
            throw new GradleException("Required extraction tool is missing: ${aeTarExtractTool}")
        }
        if (!aeVulkanWrapperArchive.isFile()) {
            throw new GradleException("Required Vulkan wrapper archive is missing: ${aeVulkanWrapperArchive}")
        }
        outputDir.mkdirs()
        List<String> command = [
                "python3",
                aeTarExtractTool.absolutePath,
                "--archive",
                aeVulkanWrapperArchive.absolutePath,
                "--member",
                "libvulkan_wrapper.so",
                "--output",
                outputFile.absolutePath
        ]
        Process process = new ProcessBuilder(command)
                .redirectErrorStream(true)
                .start()
        process.inputStream.eachLine { line -> println(line) }
        int exitCode = process.waitFor()
        if (exitCode != 0) {
            throw new GradleException("Vulkan wrapper JNI extraction failed with exit code ${exitCode}")
        }
    }
}

tasks.register("buildNativeLlvm22") {
    onlyIf { aeUseLlvm22Native }
    File outputDir = new File(aeGeneratedJniLibsDir, "arm64-v8a")
    File sourceDir = new File(projectDir, "src/main/cpp")
    inputs.dir(sourceDir)
    inputs.file(aeLlvm22AndroidToolchainFile)
    inputs.property("aeLlvm22Root", aeLlvm22Root)
    outputs.dir(outputDir)
    doLast {
        File clang = new File(aeLlvm22Root, "bin/clang")
        File clangxx = new File(aeLlvm22Root, "bin/clang++")
        if (!clang.isFile() || !clang.canExecute() || !clangxx.isFile() || !clangxx.canExecute()) {
            throw new GradleException("LLVM 22.1.1 toolchain is required: ${aeLlvm22Root}")
        }
        if (!aeLlvm22AndroidToolchainFile.isFile()) {
            throw new GradleException("LLVM 22.1.1 Android toolchain file is missing: ${aeLlvm22AndroidToolchainFile}")
        }

        String versionOutput = AeBuildHostSupport.runCommand([clang.absolutePath, "--version"], null, true)
        if (!versionOutput.contains("22.1.1")) {
            throw new GradleException("Native APK build must use clang 22.1.1, got: ${versionOutput.readLines().take(1).join("")}")
        }

        File cacheFile = new File(aeLlvm22NativeBuildDir, "CMakeCache.txt")
        if (cacheFile.isFile() && !cacheFile.getText("UTF-8").contains("CMAKE_HOME_DIRECTORY:INTERNAL=${sourceDir.absolutePath}")) {
            aeLlvm22NativeBuildDir.deleteDir()
        }
        File buildLog = aeLlvm22NativeLogFile
        if (buildLog.isFile()) buildLog.delete()

        AeBuildHostSupport.runCommand([
                "cmake",
                "-S", sourceDir.absolutePath,
                "-B", aeLlvm22NativeBuildDir.absolutePath,
                "-G", "Ninja",
                "-DCMAKE_TOOLCHAIN_FILE=${aeLlvm22AndroidToolchainFile.absolutePath}",
                "-DAEO_LLVM22_ROOT=${aeLlvm22Root}"
        ], null, false, buildLog)
        AeBuildHostSupport.runCommand(["cmake", "--build", aeLlvm22NativeBuildDir.absolutePath, "--", "-j8"], null, false, buildLog)

        outputDir.mkdirs()
        aeLlvm22NativeOutputPaths.each { relativePath ->
            File source = new File(aeLlvm22NativeBuildDir, relativePath)
            if (!source.isFile()) {
                throw new GradleException("LLVM 22.1.1 native output is missing: ${source}")
            }
            Files.copy(source.toPath(), new File(outputDir, source.name).toPath(), StandardCopyOption.REPLACE_EXISTING)
        }
    }
}

tasks.register("cleanLlvm22GeneratedJniWhenDisabled") {
    onlyIf { !aeUseLlvm22Native }
    doLast {
        File outputDir = new File(aeGeneratedJniLibsDir, "arm64-v8a")
        aeLlvm22GeneratedOutputNames.each { fileName ->
            File generated = new File(outputDir, fileName)
            if (generated.exists() && !generated.delete()) {
                throw new GradleException("Unable to remove stale LLVM22 generated JNI output: ${generated}")
            }
        }
    }
}

